<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Call Beyond</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@1,300;1,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #060d1f;
        }

        /* ── SCENE ── */
        .scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            animation: sceneFadeIn 2.8s ease-out forwards;
        }

        @keyframes sceneFadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* ── SKY ── */
        .sky {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                #060d1f  0%,
                #0e1f3e  18%,
                #1b2d5c  32%,
                #2b3972  46%,
                #57437e  58%,
                #a06068  68%,
                #cd7c50  78%,
                #e8a06a  86%,
                #f5c88a  93%,
                #fde0b8 100%
            );
        }

        /* ── MOON ── */
        .moon {
            position: absolute;
            top: 9%;
            right: 22%;
            width: clamp(50px, 5.5vw, 86px);
            height: clamp(50px, 5.5vw, 86px);
            border-radius: 50%;
            background: radial-gradient(
                circle at 38% 38%,
                #fffdf2,
                #fff0cc 40%,
                #f6d98c 80%,
                #e8c572 100%
            );
            box-shadow:
                0 0 28px 10px rgba(255,235,160,0.45),
                0 0 65px 28px rgba(255,215,120,0.25),
                0 0 115px 52px rgba(255,200,100,0.12),
                0 0 190px 85px rgba(255,185,80,0.06);
        }

        /* ── STARS ── */
        #starCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 65%;
            pointer-events: none;
        }

        /* ── MOUNTAINS ── */
        .mountains-wrap {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80%;
            pointer-events: none;
        }
        .mountains-wrap svg {
            width: 100%;
            height: 100%;
        }

        /* ── CSS MIST OVERLAYS ── */
        .mist-base {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 28%;
            background: linear-gradient(
                to top,
                rgba(210,225,248,0.78) 0%,
                rgba(205,222,244,0.46) 35%,
                rgba(200,218,240,0.18) 65%,
                transparent 100%
            );
            filter: blur(12px);
            pointer-events: none;
        }

        .mist-float {
            position: absolute;
            bottom: 18%;
            left: -15%;
            width: 130%;
            height: 18%;
            background: linear-gradient(
                to top,
                rgba(195,215,244,0.42) 0%,
                rgba(190,212,240,0.20) 50%,
                transparent 100%
            );
            filter: blur(20px);
            pointer-events: none;
            animation: floatMist 26s ease-in-out infinite alternate;
        }

        .mist-float-2 {
            position: absolute;
            bottom: 30%;
            left: -25%;
            width: 150%;
            height: 12%;
            background: linear-gradient(
                to top,
                rgba(185,210,242,0.26) 0%,
                rgba(180,208,238,0.12) 50%,
                transparent 100%
            );
            filter: blur(24px);
            pointer-events: none;
            animation: floatMist 38s ease-in-out infinite alternate-reverse;
        }

        @keyframes floatMist {
            0%   { transform: translateX(0%)   scaleY(1);    opacity: 0.70; }
            50%  { transform: translateX(4%)   scaleY(1.08); opacity: 1;    }
            100% { transform: translateX(8%)   scaleY(0.94); opacity: 0.80; }
        }

        /* ── VIGNETTE ── */
        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(
                ellipse at 50% 45%,
                transparent 38%,
                rgba(0,0,0,0.45) 100%
            );
            pointer-events: none;
        }

        /* ═══════════════════════════════════════
           VICTORY COMPOSITION SYSTEM
        ═══════════════════════════════════════ */

        /* Fixed overlay above the scene; scrollable on short screens */
        #victoryWrap {
            position: fixed;
            inset: 0;
            overflow-y: auto;
            overflow-x: hidden;
            pointer-events: none;
            z-index: 10;
            -webkit-overflow-scrolling: touch;
        }

        /* Flex column — centers content when it fits, scrolls when it doesn't */
        .victory-inner {
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5vh 4vw;
            gap: clamp(0.6rem, 1.8vh, 1.8rem);
            text-align: center;
            width: clamp(280px, 86%, 780px);
            margin: 0 auto;
        }

        /* ── GOD SYMBOLS ROW ── */
        #symbolsRow {
            display: flex;
            flex-direction: row;
            align-items: flex-end;
            justify-content: center;
            gap: clamp(2.2rem, 6vw, 5rem);
            opacity: 0;
            pointer-events: none;
            width: 100%;
            /* Extra breath between the Walter Mitty quotation and the reward section */
            margin-top: clamp(1rem, 2.5vh, 2.5rem);
        }

        #symbolsRow.visible {
            animation: fadeSlideUp 2s ease-out forwards;
        }

        .sym-icon {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sym-svg {
            height: clamp(50px, 8vw, 88px);
            width: auto;
            display: block;
        }

        /* ── QUOTE ── */
        #quoteText {
            text-align: center;
            pointer-events: none;
            width: 100%;
            opacity: 0;
        }

        #quoteText.visible {
            animation: fadeSlideUp 3.5s ease-out forwards;
        }

        /* ── VICTORY BLOCK ── */
        #victoryBlock {
            text-align: center;
            pointer-events: none;
            width: 100%;
            opacity: 0;
        }

        #victoryBlock.visible {
            animation: fadeSlideUp 2.5s ease-out forwards;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0);    }
        }

        /* ── QUOTE FONT ── */
        .main-quote {
            font-family: 'Cormorant Garamond', 'Georgia', serif;
            font-style: italic;
            font-weight: 300;
            font-size: clamp(1.05rem, 2.6vw, 1.75rem);
            letter-spacing: 0.06em;
            line-height: 1.9;
            color: rgba(255,252,235,0.90);
            text-shadow:
                0 2px 10px rgba(0,0,0,0.70),
                0 0 40px rgba(200,150,80,0.22);
        }

        /* ── VICTORY TEXT ELEMENTS ── */
        .victory-heading {
            font-family: 'Cinzel', serif;
            font-weight: 600;
            font-size: clamp(0.65rem, 1.6vw, 1rem);
            letter-spacing: 0.38em;
            text-transform: uppercase;
            color: rgba(255,252,235,0.88);
            text-shadow: 0 2px 12px rgba(0,0,0,0.75);
            margin-bottom: clamp(0.35rem, 1.2vh, 1rem);
        }

        .victory-poem {
            font-family: 'Cormorant Garamond', 'Georgia', serif;
            font-style: italic;
            font-weight: 300;
            font-size: clamp(0.82rem, 1.9vw, 1.2rem);
            letter-spacing: 0.04em;
            line-height: 2;
            text-shadow: 0 2px 10px rgba(0,0,0,0.70);
        }

        .victory-points {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.1rem, 3vw, 2rem);
            letter-spacing: 0.28em;
            text-shadow: 0 0 28px currentColor, 0 2px 10px rgba(0,0,0,0.70);
            margin-top: clamp(0.2rem, 0.8vh, 0.6rem);
        }

        .points-label {
            font-size: 0.52em;
            letter-spacing: 0.22em;
        }

        /* ── GOD COLOURS ── */
        .c-zeus     { color: #e8d472; }
        .c-poseidon { color: #72b8d8; }
        .c-hades    { color: #c09ae0; }
        .c-moonlit  { color: rgba(255,252,240,0.95); }

        /* ── RETURN GATE ── */
        #returnGate {
            position: fixed;
            bottom: max(clamp(1.2rem, 3vh, 2rem), calc(env(safe-area-inset-bottom, 0px) + 1rem));
            right: clamp(1rem, 3vw, 2rem);
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            z-index: 15;
            text-decoration: none;
            color: rgba(255,252,235,0.28);
            border-radius: 50%;
            -webkit-tap-highlight-color: transparent;
            transition: color 0.5s ease, filter 0.5s ease;
        }

        #returnGate.visible {
            pointer-events: auto;
            animation: fadeSlideUp 2.5s ease-out forwards;
        }

        #returnGate:hover,
        #returnGate:focus-visible {
            color: rgba(255,252,235,0.72);
            filter: drop-shadow(0 0 9px rgba(225,220,190,0.40));
            outline: none;
        }

        #returnGate svg {
            width: 36px;
            height: 36px;
            display: block;
        }

        /* ── CLICK PROMPT ── */
        .click-prompt {
            position: fixed;
            bottom: 6%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Cinzel', serif;
            font-size: clamp(0.58rem, 1.1vw, 0.76rem);
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: rgba(255,240,200,0.45);
            pointer-events: none;
            white-space: nowrap;
            animation: breathe 3.2s ease-in-out infinite;
            transition: opacity 1.6s ease;
            z-index: 10;
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 600px) {
            .sym-svg         { height: clamp(36px, 10vw, 60px); }
            #symbolsRow      { gap: clamp(1.5rem, 8vw, 3.5rem); margin-top: clamp(0.8rem, 2vh, 1.8rem); }
            .main-quote      { font-size: clamp(1rem, 5vw, 1.3rem); line-height: 2; }
            .victory-heading { font-size: clamp(0.58rem, 3vw, 0.75rem); letter-spacing: 0.28em; }
            .victory-poem    { font-size: clamp(0.78rem, 4vw, 1rem); }
            .victory-points  { font-size: clamp(1rem, 6vw, 1.5rem); }
            .click-prompt {
                font-size: 0.6rem;
                letter-spacing: 0.22em;
                white-space: normal;
                text-align: center;
                width: 80%;
                left: 10%;
                transform: none;
            }
            .moon { top: 6%; right: 10%; }
        }

        @media (max-height: 580px) {
            .victory-inner   { gap: clamp(0.3rem, 1vh, 0.8rem); padding: 3vh 4vw; }
            #symbolsRow      { margin-top: clamp(0.4rem, 1vh, 0.8rem); }
            .sym-svg         { height: clamp(32px, 6vw, 50px); }
            .victory-heading { font-size: clamp(0.58rem, 1.4vw, 0.82rem); }
            .victory-poem    { font-size: clamp(0.75rem, 1.6vw, 1rem); line-height: 1.7; }
            .victory-points  { font-size: clamp(0.9rem, 2.5vw, 1.5rem); }
        }

        @media (prefers-reduced-motion: reduce) {
            #symbolsRow.visible,
            #quoteText.visible,
            #victoryBlock.visible,
            #returnGate.visible {
                animation: none;
                opacity: 1;
            }
            .mist-float, .mist-float-2 { animation: none; }
        }

        .click-prompt.hide { opacity: 0; }

        @keyframes breathe {
            0%,100% { opacity: 0.18; }
            50%      { opacity: 0.62; }
        }

        /* ── FIREFLIES ── */
        .firefly {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: fireflyRise linear infinite;
        }

        @keyframes fireflyRise {
            0%   { opacity: 0;    transform: translateY(0)     translateX(0);    }
            6%   { opacity: 1; }
            50%  { opacity: 0.7;  transform: translateY(-42vh) translateX(18px); }
            94%  { opacity: 0.15; }
            100% { opacity: 0;    transform: translateY(-82vh) translateX(-8px); }
        }

        /* ── WILDCARD INTRO SCREEN ── */
        #wildcardScreen {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 1.8s ease;
        }

        #cardContainer {
            perspective: 1200px;
            cursor: pointer;
        }

        #cardInner {
            position: relative;
            display: inline-block;
            transform-style: preserve-3d;
            transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #cardInner.flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .card-back {
            position: absolute;
            inset: 0;
            background: #050810;
            transform: rotateY(180deg);
            border-radius: 8px;
        }

        #wildcardImg {
            max-width: clamp(130px, 22vw, 300px);
            max-height: 62vh;
            object-fit: contain;
            display: block;
            opacity: 0;
            animation: wildcardFadeIn 1.8s ease-out 1s forwards;
        }

        @keyframes wildcardFadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* ── TOUCH ── */
        #scene { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body>

<!-- Wildcard intro screen -->
<div id="wildcardScreen">
    <div id="cardContainer">
        <div id="cardInner">
            <div class="card-front">
                <img id="wildcardImg" src="Resources/WildCard.png" alt="">
            </div>
            <div class="card-back"></div>
        </div>
    </div>
</div>

<div class="scene" id="scene">

    <!-- Sky -->
    <div class="sky"></div>

    <!-- Twinkling stars (canvas) -->
    <canvas id="starCanvas"></canvas>

    <!-- Moon -->
    <div class="moon"></div>

    <!-- ── LAYERED MOUNTAIN SVG ── -->
    <div class="mountains-wrap">
        <svg viewBox="0 0 1440 720" preserveAspectRatio="xMidYMax slice"
             xmlns="http://www.w3.org/2000/svg">
            <defs>
                <filter id="mblur" x="-20%" y="-20%" width="140%" height="140%">

            </defs>

                   C1176,250 1230,252 1292,260 C1342,267 1400,262 1440,268

            <!-- Layer 2 – distant, soft indigo -->
            <path fill="rgba(108,126,186,0.33)"

            <!-- Valley mist – between layers 3 and 4 -->
            <path fill="rgba(198,218,242,0.30)" filter="url(#mblur)"
                d="M0,544 Q160,514 320,540 Q480,566 640,544
                   Q800,522 960,548 Q1120,574 1280,550 Q1380,537 1440,546

            <!-- Layer 4 – mid-near, dark indigo -->
            <path fill="rgba(46,54,108,0.64)"

            <!-- Valley mist – lower band -->
            <path fill="rgba(193,215,242,0.38)" filter="url(#mblur)"

            <!-- Layer 6 – foreground, near-black -->

            <!-- Layer 7 – darkest foreground ridge -->
            <path fill="rgba(5,7,20,0.96)"

    </div>

    <!-- CSS mist layers -->
    <div class="mist-base"></div>
    <div class="mist-float"></div>
    <div class="mist-float-2"></div>

    <!-- Cinematic vignette -->
    <div class="vignette"></div>

</div><!-- /.scene -->

<!-- Victory composition overlay (fixed, scrollable on short screens) -->
<div id="victoryWrap">
    <div class="victory-inner">

        <!-- Walter Mitty quote (appears first) -->
        <div id="quoteText">
            <div class="main-quote">To see the world, things dangerous to come to,<br>to see behind walls, draw closer,<br>to find each other, and to feel.<br>That is the purpose of life.</div>
        </div>

        <!-- God symbols in completion order: appear after quote (populated by JS) -->
        <div id="symbolsRow"></div>

        <!-- Victory heading, poetic lines, points (populated by JS) -->
        <div id="victoryBlock"></div>

    </div>
</div>

<!-- Return-to-beginning temple gate -->
<a id="returnGate" href="index.html" aria-label="Return to the beginning">
    <svg viewBox="0 0 56 56" fill="none" stroke="currentColor"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="28" cy="28" r="24.5" stroke-width="0.7" stroke-opacity="0.5"/>
        <polyline points="13,24 28,12 43,24" stroke-width="1.4"/>
        <line x1="12" y1="24" x2="44" y2="24" stroke-width="1.4"/>
        <line x1="17" y1="24" x2="17" y2="44" stroke-width="1.4"/>
        <line x1="39" y1="24" x2="39" y2="44" stroke-width="1.4"/>
        <line x1="12" y1="44" x2="44" y2="44" stroke-width="1.4"/>
        <line x1="10" y1="46.5" x2="46" y2="46.5" stroke-width="0.9"/>
    </svg>
</a>

<script>
/* ── ACCESS GATE ── */
(function () {
    const zeusOk     = sessionStorage.getItem('zeus_complete')     === '1';
    const poseidonOk = sessionStorage.getItem('poseidon_complete') === 'true';
    const hadesOk    = sessionStorage.getItem('hades_complete')    === 'true';
    if (!zeusOk && !poseidonOk && !hadesOk) {
        window.location.replace('index.html');
    }
})();

/* ══════════════════════════════════════
   TWINKLING STAR CANVAS
══════════════════════════════════════ */
(function () {
    const canvas = document.getElementById('starCanvas');
    const ctx    = canvas.getContext('2d');
    let   stars  = [];

    function init() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight * 0.65;
        stars = Array.from({ length: 210 }, () => ({
            x:    Math.random() * canvas.width,
            y:    Math.random() * canvas.height,
            r:    0.4 + Math.random() * 1.5,
            base: 0.22 + Math.random() * 0.65,
            spd:  0.35 + Math.random() * 1.8,
            ph:   Math.random() * Math.PI * 2
        }));
    }

    function draw(ts) {
        const t = ts / 1000;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const s of stars) {
            const op = s.base * (0.5 + 0.5 * Math.sin(t * s.spd + s.ph));
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255,252,240,${op.toFixed(3)})`;
            ctx.fill();
        }
        requestAnimationFrame(draw);
    }

    init();
    requestAnimationFrame(draw);
    window.addEventListener('resize', init);
})();

/* ══════════════════════════════════════
   FIREFLIES
══════════════════════════════════════ */
(function () {
    const scene = document.getElementById('scene');

    function spawn() {
        const el  = document.createElement('div');
        el.className = 'firefly';
        const sz  = 1.5 + Math.random() * 2.5;
        const dur = 18 + Math.random() * 22;
        el.style.cssText = [
            `width:${sz}px`,
            `height:${sz}px`,
            `left:${5 + Math.random() * 90}%`,
            `bottom:${5 + Math.random() * 28}%`,
            `background:rgba(255,${185 + Math.random() * 55 | 0},80,0.82)`,
            `box-shadow:0 0 ${sz * 3}px ${sz}px rgba(255,210,80,0.48)`,
            `animation-duration:${dur}s`,
            `animation-delay:${(Math.random() * -dur).toFixed(1)}s`
        ].join(';');
        scene.appendChild(el);
        setTimeout(() => el.remove(), (dur + 5) * 1000);
    }

    for (let i = 0; i < 14; i++) setTimeout(spawn, i * 400);
    setInterval(spawn, 3200);
})();

/* ══════════════════════════════════════
   VICTORY REVEAL SYSTEM
   Reads tcb_completed_paths from localStorage,
   builds god symbols + heading + poetic text + points.
   Also controls the return-gate symbol.
══════════════════════════════════════ */
(function () {
    var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* ── Return gate: click / keyboard handler (always active) ── */
    var gate = document.getElementById('returnGate');
    if (gate) {
        function navigateHome() {
            var aud = window._bgAudio;
            if (aud && !aud.paused && aud.volume > 0) {
                /* Fade audio to 0 over ~400 ms, then navigate */
                var steps = 16, dt = 25, vol = aud.volume, step = vol / steps;
                var id = setInterval(function () {
                    vol = Math.max(0, vol - step);
                    try { aud.volume = vol; } catch (ex) {}
                    if (vol <= 0) { clearInterval(id); window.location.href = 'index.html'; }
                }, dt);
            } else {
                window.location.href = 'index.html';
            }
        }
        gate.addEventListener('click', function (e) { e.preventDefault(); navigateHome(); });
        gate.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); navigateHome(); }
        });
    }

    /* ── Gate reveal hook (called by scheduleQuote after all other content settles) ── */
    window._revealGate = function () {
        if (!gate) return;
        if (prefersReduced) { gate.style.opacity = '1'; gate.style.pointerEvents = 'auto'; }
        else                { gate.classList.add('visible'); }
    };

    /* ── Read completed paths (order preserved) ── */
    var completedPaths = [];
    try {
        var raw = localStorage.getItem('tcb_completed_paths');
        var arr = raw ? JSON.parse(raw) : [];
        if (Array.isArray(arr)) {
            completedPaths = arr.filter(function (p) {
                return p === 'zeus' || p === 'poseidon' || p === 'hades';
            });
        }
    } catch (e) {}

    var symbolsRow   = document.getElementById('symbolsRow');
    var victoryBlock = document.getElementById('victoryBlock');

    if (completedPaths.length === 0) {
        /* No recorded paths — collapse placeholders so they don't add gap */
        symbolsRow.style.display   = 'none';
        victoryBlock.style.display = 'none';
        return;
    }

    /* ── SVG namespace helper ── */
    function ns(tag) { return document.createElementNS('http://www.w3.org/2000/svg', tag); }

    /* ── Zeus: Lightning Bolt ── */
    function buildBolt() {
        var svg  = ns('svg');
        svg.setAttribute('viewBox', '0 0 54 100');
        svg.setAttribute('fill', 'currentColor');
        svg.className.baseVal = 'sym-svg c-zeus';
        var poly = ns('polygon');
        poly.setAttribute('points', '36,4 14,52 28,52 18,96 46,44 30,44 48,4');
        svg.appendChild(poly);
        return svg;
    }

    /* ── Poseidon: Trident ── */
    function buildTrident() {
        var svg = ns('svg');
        svg.setAttribute('viewBox', '0 0 60 130');
        svg.setAttribute('fill', 'none');
        svg.setAttribute('stroke', 'currentColor');
        svg.setAttribute('stroke-width', '2.2');
        svg.setAttribute('stroke-linecap', 'round');
        svg.setAttribute('stroke-linejoin', 'round');
        svg.className.baseVal = 'sym-svg c-poseidon';

        function L(x1, y1, x2, y2) {
            var el = ns('line');
            el.setAttribute('x1', x1); el.setAttribute('y1', y1);
            el.setAttribute('x2', x2); el.setAttribute('y2', y2);
            return el;
        }
        function PL(pts) {
            var el = ns('polyline');
            el.setAttribute('points', pts);
            return el;
        }
        svg.appendChild(L(30, 62, 30, 122));
        svg.appendChild(L(12, 76, 48, 76));
        svg.appendChild(L(30, 62, 30, 10));
        svg.appendChild(PL('24,24 30,10 36,24'));
        svg.appendChild(L(12, 76, 12, 28));
        svg.appendChild(PL('7,41 12,28 17,41'));
        svg.appendChild(L(48, 76, 48, 28));
        svg.appendChild(PL('43,41 48,28 53,41'));
        return svg;
    }

    /* ── Hades: Skull ── */
    function buildSkull() {
        var svg = ns('svg');
        svg.setAttribute('viewBox', '0 0 80 92');
        svg.setAttribute('fill', 'none');
        svg.setAttribute('stroke', 'currentColor');
        svg.setAttribute('stroke-width', '2.2');
        svg.setAttribute('stroke-linecap', 'round');
        svg.setAttribute('stroke-linejoin', 'round');
        svg.className.baseVal = 'sym-svg c-hades';

        var cranium = ns('path');
        cranium.setAttribute('d',
            'M40,10 C20,10 12,26 12,44 C12,59 19,67 27,72' +
            ' L27,82 L53,82 L53,72 C61,67 68,59 68,44' +
            ' C68,26 60,10 40,10 Z');
        svg.appendChild(cranium);

        function E(cx, cy, rx, ry) {
            var el = ns('ellipse');
            el.setAttribute('cx', cx); el.setAttribute('cy', cy);
            el.setAttribute('rx', rx); el.setAttribute('ry', ry);
            return el;
        }
        svg.appendChild(E(28, 44, 9, 10));
        svg.appendChild(E(52, 44, 9, 10));

        var nose = ns('path');
        nose.setAttribute('d', 'M36,61 L40,55 L44,61 Z');
        svg.appendChild(nose);

        function L(x1, y1, x2, y2) {
            var el = ns('line');
            el.setAttribute('x1', x1); el.setAttribute('y1', y1);
            el.setAttribute('x2', x2); el.setAttribute('y2', y2);
            return el;
        }
        svg.appendChild(L(36, 72, 36, 82));
        svg.appendChild(L(44, 72, 44, 82));
        return svg;
    }

    var SVG_BUILDERS = { zeus: buildBolt, poseidon: buildTrident, hades: buildSkull };

    /* ── Populate symbols row in completion order ── */
    completedPaths.forEach(function (god) {
        if (!SVG_BUILDERS[god]) return;
        var item = document.createElement('div');
        item.className = 'sym-icon';
        item.appendChild(SVG_BUILDERS[god]());
        symbolsRow.appendChild(item);
    });

    /* ── Text tables ── */
    var ONE_PATH_LINE = {
        zeus:     'The sky itself bears witness.',
        poseidon: 'The final tide has carried you beyond all others.',
        hades:    'You crossed the final gate and returned with what was hidden.'
    };
    var TWO_PATH_LINE = {
        zeus:     'The sky itself bears witness.',
        poseidon: 'The final tide carries your name beyond the shore.',
        hades:    'The gates below remember your return.'
    };
    var COLOR_CLASS = { zeus: 'c-zeus', poseidon: 'c-poseidon', hades: 'c-hades' };
    var POINTS_BY_COUNT = [0, 35, 70, 199];

    var n   = completedPaths.length;
    var pts = POINTS_BY_COUNT[n] || 0;

    /* Heading — universal */
    var heading = document.createElement('div');
    heading.className   = 'victory-heading';
    heading.textContent = 'You have answered the call';
    victoryBlock.appendChild(heading);

    /* Poetic lines — varies by path count */
    if (n === 3) {
        var poem = document.createElement('div');
        poem.className = 'victory-poem c-moonlit';
        poem.innerHTML =
            'The dead spoke your name. The sky bore witness.<br>' +
            'The sea carried you beyond the final shore.<br>' +
            'Three paths. Three realms. One final discovery.<br>' +
            '<em>Congratulations\u2014the final discovery belongs to you.</em>';
        victoryBlock.appendChild(poem);
    } else if (n === 2) {
        completedPaths.forEach(function (god) {
            var line = document.createElement('div');
            line.className   = 'victory-poem ' + (COLOR_CLASS[god] || '');
            line.textContent = TWO_PATH_LINE[god] || '';
            victoryBlock.appendChild(line);
        });
        var closing = document.createElement('div');
        closing.className = 'victory-poem c-moonlit';
        closing.innerHTML =
            'Two realms now bear witness to your journey.<br>' +
            '<em>Congratulations\u2014the final discovery belongs to you.</em>';
        victoryBlock.appendChild(closing);
    } else {
        /* n === 1 */
        var god0 = completedPaths[0];
        var oneLine = document.createElement('div');
        oneLine.className = 'victory-poem ' + (COLOR_CLASS[god0] || '');
        oneLine.innerHTML =
            (ONE_PATH_LINE[god0] || '') +
            '<br><em>Congratulations\u2014the final discovery belongs to you.</em>';
        victoryBlock.appendChild(oneLine);
    }

    /* Points */
    var ptsEl  = document.createElement('div');
    var ptsCls = (n === 1) ? (COLOR_CLASS[completedPaths[0]] || 'c-moonlit') : 'c-moonlit';
    ptsEl.className = 'victory-points ' + ptsCls;
    ptsEl.innerHTML = pts + ' <span class="points-label">POINTS</span>';
    victoryBlock.appendChild(ptsEl);

    /* ── Expose reveal hooks for scheduleQuote ── */
    window._revealSymbols = function () {
        if (prefersReduced) { symbolsRow.style.opacity = '1'; }
        else                { symbolsRow.classList.add('visible'); }
    };
    window._revealVictory = function () {
        if (prefersReduced) { victoryBlock.style.opacity = '1'; }
        else                { victoryBlock.classList.add('visible'); }
    };
})();

/* ══════════════════════════════════════
   WILDCARD GLOW + HOVER (JS-driven)
══════════════════════════════════════ */
(function () {
    const img       = document.getElementById('wildcardImg');
    const container = document.getElementById('cardContainer');
    let hovered      = false;
    let rafId;
    let phase        = 0;
    let fadeProgress = 0;

    function glow() {
        if (hovered) return;
        fadeProgress = Math.min(1, fadeProgress + 1 / 90);
        phase += 0.033;
        const t      = (Math.sin(phase) + 1) / 2;
        const targetB = 0.38 + t * 0.09;
        const b  = (1.0 + (targetB - 1.0) * fadeProgress).toFixed(2);
        const a1 = ((0.10 + t * 0.20) * fadeProgress).toFixed(2);
        const a2 = ((0.04 + t * 0.12) * fadeProgress).toFixed(2);
        const r1 = (8  + t * 12).toFixed(1);
        const r2 = (22 + t * 28).toFixed(1);
        img.style.filter = `brightness(${b}) drop-shadow(0 0 ${r1}px rgba(255,220,140,${a1})) drop-shadow(0 0 ${r2}px rgba(255,200,80,${a2}))`;
        rafId = requestAnimationFrame(glow);
    }

    setTimeout(() => { fadeProgress = 0; rafId = requestAnimationFrame(glow); }, 2800);

    container.addEventListener('mouseenter', () => {
        hovered = true;
        cancelAnimationFrame(rafId);
        img.style.transition = 'filter 0.4s ease, transform 0.35s ease';
        img.style.filter     = 'brightness(0.90) drop-shadow(0 0 55px rgba(255,235,160,0.92)) drop-shadow(0 0 120px rgba(255,210,100,0.55))';
        img.style.transform  = 'translateY(-5px) scale(1.11)';
    });

    container.addEventListener('mouseleave', () => {
        hovered = false;
        img.style.transition = 'filter 0.4s ease, transform 0.35s ease';
        img.style.transform  = '';
        img.style.filter     = 'brightness(0.38) drop-shadow(0 0 8px rgba(255,220,140,0.10)) drop-shadow(0 0 22px rgba(255,200,80,0.05))';
        setTimeout(() => {
            if (!hovered) {
                img.style.transition = '';
                fadeProgress = 1;
                rafId = requestAnimationFrame(glow);
            }
        }, 420);
    });
})();

/* ══════════════════════════════════════
   WILDCARD CLICK → REVEAL + AUDIO
══════════════════════════════════════ */
(function () {
    const audio  = new Audio('Resources/WakeUp.mp3');
    audio.loop   = true;
    window._bgAudio = audio; /* exposed so the return gate can fade audio before navigating */
    const screen = document.getElementById('wildcardScreen');

    function scheduleQuote() {
        /* 1. Quote at 14s (unchanged timing) */
        setTimeout(function () {
            document.getElementById('quoteText').classList.add('visible');
        }, 14000);

        /* 2. Symbols after quote has fully appeared: 14s + 3.5s anim + 1.5s pause = 19s */
        setTimeout(function () {
            if (window._revealSymbols) window._revealSymbols();
        }, 19000);

        /* 3. Victory block after symbols: 19s + 2s anim + 1s buffer = 22s */
        setTimeout(function () {
            if (window._revealVictory) window._revealVictory();
        }, 22000);

        /* 4. Return gate after all victory content settles: 22s + 2.5s anim + 0.5s = 25s */
        setTimeout(function () {
            if (window._revealGate) window._revealGate();
        }, 25000);
    }

    document.getElementById('cardContainer').addEventListener('click', function () {
        document.getElementById('cardInner').classList.add('flipped');

        setTimeout(function () {
            screen.style.opacity = '0';
            screen.style.pointerEvents = 'none';
            setTimeout(function () { screen.style.display = 'none'; }, 1800);
        }, 900);

        setTimeout(function () {
            audio.play().then(scheduleQuote).catch(function () {});
        }, 2000);
    }, { once: true });
})();
</script>
