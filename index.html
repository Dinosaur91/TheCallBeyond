<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Call Beyond</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* ── CANVAS ── */
        #mistCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        /* ── MIST OVERLAY LAYERS ── */
        .mist-layer {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            opacity: 0;
        }

        .mist-layer:nth-child(1) {
            width: 70vw; height: 40vh;
            background: radial-gradient(ellipse, #1a1a2a 0%, transparent 70%);
            top: 20%; left: -10%;
            animation: mistDrift1 14s ease-in-out infinite, mistAppear 5s 1.5s ease-out forwards;
        }
        .mist-layer:nth-child(2) {
            width: 60vw; height: 35vh;
            background: radial-gradient(ellipse, #111120 0%, transparent 70%);
            top: 50%; left: 40%;
            animation: mistDrift2 18s ease-in-out infinite, mistAppear 5s 2.5s ease-out forwards;
        }
        .mist-layer:nth-child(3) {
            width: 80vw; height: 45vh;
            background: radial-gradient(ellipse, #16161e 0%, transparent 70%);
            top: 60%; left: 10%;
            animation: mistDrift3 22s ease-in-out infinite, mistAppear 5s 1s ease-out forwards;
        }
        .mist-layer:nth-child(4) {
            width: 55vw; height: 30vh;
            background: radial-gradient(ellipse, #131325 0%, transparent 70%);
            top: 5%; left: 30%;
            animation: mistDrift4 16s ease-in-out infinite, mistAppear 5s 3s ease-out forwards;
        }
        .mist-layer:nth-child(5) {
            width: 65vw; height: 38vh;
            background: radial-gradient(ellipse, #0e0e1a 0%, transparent 70%);
            top: 35%; left: 55%;
            animation: mistDrift5 20s ease-in-out infinite, mistAppear 5s 2s ease-out forwards;
        }

        @keyframes mistAppear {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        @keyframes mistDrift1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33%       { transform: translate(8vw, -5vh) scale(1.08); }
            66%       { transform: translate(-5vw, 6vh) scale(0.95); }
        }
        @keyframes mistDrift2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            40%       { transform: translate(-10vw, 4vh) scale(1.1); }
            70%       { transform: translate(6vw, -7vh) scale(0.92); }
        }
        @keyframes mistDrift3 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            30%       { transform: translate(5vw, 8vh) scale(1.05); }
            60%       { transform: translate(-8vw, -4vh) scale(1.12); }
        }
        @keyframes mistDrift4 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%       { transform: translate(-6vw, 9vh) scale(1.06); }
        }
        @keyframes mistDrift5 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            45%       { transform: translate(9vw, -6vh) scale(0.96); }
            80%       { transform: translate(-4vw, 5vh) scale(1.08); }
        }

        /* ── BACKGROUND LIFT ── */
        .bg-lift {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 50% 60%, #12121f 0%, #000000 70%);
            opacity: 0;
            animation: bgLift 8s 1s ease-out forwards;
            pointer-events: none;
        }

        @keyframes bgLift {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* ── VIGNETTE ── */
        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 40%, #000 100%);
            pointer-events: none;
        }

        /* ── SYMBOLS (Poseidon · Zeus · Hades) ── */
        .symbols-wrap {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(6vw, 14vw, 180px);
            pointer-events: none;
            padding: 0 4vw;
        }

        .symbol-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            /* generous touch target on mobile */
            padding: 16px;
            opacity: 0;
            transform: translateY(10px);
            animation: symbolReveal 1.4s 7s ease-out forwards;
            cursor: pointer;
            pointer-events: none;
            text-decoration: none;
            transition: transform 0.35s ease, filter 0.35s ease, color 0.35s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .symbol-item.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
            animation: none;
        }

        @keyframes symbolReveal {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .symbol-item svg {
            height: clamp(110px, 16vw, 150px);
            width: auto;
            display: block;
        }

        @media (max-width: 600px) {
            .symbol-item svg { height: 75px; }
            .symbols-wrap    { gap: clamp(6vw, 10vw, 50px); }
        }

        /* Default dim state */
        #sym-poseidon { color: #2e3a4a; }
        #sym-zeus     { color: #3a3620; }
        #sym-hades    { color: #2e2238; }

        /* Hover — each god's signature colour */
        #sym-poseidon:hover {
            color: #72b8d8;
            filter: drop-shadow(0 0 14px rgba(90, 170, 220, 0.65));
            transform: translateY(-4px) scale(1.1);
        }
        #sym-zeus:hover {
            color: #e8d472;
            filter: drop-shadow(0 0 14px rgba(230, 200, 80, 0.65));
            transform: translateY(-4px) scale(1.1);
        }
        #sym-hades:hover {
            color: #c09ae0;
            filter: drop-shadow(0 0 14px rgba(175, 120, 230, 0.65));
            transform: translateY(-4px) scale(1.1);
        }

        /* ── PAGE TRANSITION – FADE + DIRECTIONAL ZOOM ── */
        /* Screen fades to black while zooming toward the destination —
           no visible colour pop, no hard edge, fully cinematic */
        #trans-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            pointer-events: none;
        }
        #trans-overlay.to-ocean,
        #trans-overlay.to-sky,
        #trans-overlay.to-hell  { background: #000; animation: overlayIn 0.9s ease-in forwards; }

        @keyframes overlayIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* Body zooms + drifts toward the realm — gives the sense of travel */
        body.rush-ocean { animation: zoomOcean 0.9s ease-in forwards; }
        body.rush-sky   { animation: zoomSky   0.9s ease-in forwards; }
        body.rush-hell  { animation: zoomHell  0.9s ease-in forwards; }

        @keyframes zoomOcean {
            from { transform: scale(1)    translateX(0);  }
            to   { transform: scale(1.18) translateX(8%); }
        }
        @keyframes zoomSky {
            from { transform: scale(1)    translateY(0);  }
            to   { transform: scale(1.18) translateY(8%); }
        }
        @keyframes zoomHell {
            from { transform: scale(1)    translateY(0);   }
            to   { transform: scale(1.18) translateY(-8%); }
        }
        /* ── BAN OVERLAY ── */
        #ban-overlay {
            position: fixed; inset: 0; z-index: 500;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: radial-gradient(ellipse at 50% 44%, rgba(30,0,0,0.97) 0%, rgba(0,0,0,0.99) 70%);
            pointer-events: all;
        }
        #ban-overlay h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(0.68rem,1.7vw,0.96rem);
            letter-spacing: 0.40em; text-transform: uppercase;
            color: rgba(200,50,30,0.92); text-align: center;
            line-height: 2.4; margin-bottom: 1.4em;
        }
        #ban-countdown {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.8rem,5vw,3.0rem);
            letter-spacing: 0.22em; color: rgba(170,30,15,0.85);
        }
        #ban-sub {
            font-family: 'Cinzel', serif;
            font-size: clamp(0.46rem,0.9vw,0.56rem);
            letter-spacing: 0.28em; text-transform: uppercase;
            color: rgba(130,25,12,0.55); margin-top: 1.4em; text-align: center;
        }
    </style>
</head>
<body>

    <!-- Mist layers -->
    <div class="mist-layer"></div>
    <div class="mist-layer"></div>
    <div class="mist-layer"></div>
    <div class="mist-layer"></div>
    <div class="mist-layer"></div>

    <!-- Subtle background glow lift -->
    <div class="bg-lift"></div>

    <!-- Vignette -->
    <div class="vignette"></div>

    <!-- Symbols -->
    <div class="symbols-wrap">

        <!-- Poseidon – Trident (left) -->
        <a class="symbol-item" href="#" id="sym-poseidon">
            <svg viewBox="0 0 60 130" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round">
                <!-- shaft -->
                <line x1="30" y1="62" x2="30" y2="122"/>
                <!-- crossguard -->
                <line x1="12" y1="76" x2="48" y2="76"/>
                <!-- centre prong -->
                <line x1="30" y1="62" x2="30" y2="10"/>
                <polyline points="24,24 30,10 36,24"/>
                <!-- left prong -->
                <line x1="12" y1="76" x2="12" y2="28"/>
                <polyline points="7,41 12,28 17,41"/>
                <!-- right prong -->
                <line x1="48" y1="76" x2="48" y2="28"/>
                <polyline points="43,41 48,28 53,41"/>
            </svg>
        </a>

        <!-- Zeus – Lightning Bolt (centre) -->
        <a class="symbol-item" href="#" id="sym-zeus">
            <svg viewBox="0 0 54 100" fill="currentColor">
                <polygon points="36,4 14,52 28,52 18,96 46,44 30,44 48,4"/>
            </svg>
        </a>

        <!-- Hades – Skull (right) -->
        <a class="symbol-item" href="#" id="sym-hades">
            <svg viewBox="0 0 80 92" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round">
                <!-- cranium -->
                <path d="M40,10 C20,10 12,26 12,44 C12,59 19,67 27,72 L27,82 L53,82 L53,72 C61,67 68,59 68,44 C68,26 60,10 40,10 Z"/>
                <!-- left eye socket -->
                <ellipse cx="28" cy="44" rx="9" ry="10"/>
                <!-- right eye socket -->
                <ellipse cx="52" cy="44" rx="9" ry="10"/>
                <!-- nose -->
                <path d="M36,61 L40,55 L44,61 Z"/>
                <!-- teeth dividers -->
                <line x1="36" y1="72" x2="36" y2="82"/>
                <line x1="44" y1="72" x2="44" y2="82"/>
            </svg>
        </a>

    </div>

    <!-- Page transition overlay -->
    <div id="trans-overlay"></div>

    <script>
        /* ── BAN CHECK ── */
        function showBanOverlay(expiresAt) {
            document.querySelectorAll('.symbol-item').forEach(el => {
                el.style.pointerEvents = 'none';
                el.style.opacity = '0.12';
            });
            var ov = document.createElement('div');
            ov.id = 'ban-overlay';
            ov.innerHTML =
                '<h1>THE GODS HAVE CLOSED THEIR GATES<br>'
                + '<span style="font-size:0.72em;letter-spacing:0.26em;color:rgba(155,32,15,0.72);">'
                + 'You have been cast out of the divine realm</span></h1>'
                + '<div id="ban-countdown"></div>'
                + '<div id="ban-sub">The gates reopen when judgment is served</div>';
            document.body.appendChild(ov);
            function tick() {
                var rem = Math.max(0, expiresAt - Date.now());
                if (rem <= 0) {
                    ov.remove();
                    localStorage.removeItem('ban_expires');
                    document.querySelectorAll('.symbol-item').forEach(el => {
                        el.style.pointerEvents = '';
                        el.style.opacity = '';
                    });
                    return;
                }
                var mm = String(Math.floor(rem / 60000)).padStart(2,'0');
                var ss = String(Math.floor((rem % 60000) / 1000)).padStart(2,'0');
                document.getElementById('ban-countdown').textContent = mm + ':' + ss;
                setTimeout(tick, 500);
            }
            tick();
        }
        (function(){
            var exp = parseInt(localStorage.getItem('ban_expires')||'0', 10);
            if (Date.now() < exp) { showBanOverlay(exp); }
        })();

        const routes = {
            'sym-poseidon': { ovl: 'to-ocean', body: 'rush-ocean', href: 'poseidon.html' },
            'sym-zeus':     { ovl: 'to-sky',   body: 'rush-sky',   href: 'zeus.html'     },
            'sym-hades':    { ovl: 'to-hell',  body: 'rush-hell',  href: 'hades.html'    }
        };

        const overlay = document.getElementById('trans-overlay');

        // When the browser restores this page from bfcache (back button),
        // the transition classes are still applied — wipe them so the page is visible.
        window.addEventListener('pageshow', function (e) {
            if (e.persisted) {
                overlay.className = '';
                overlay.style.pointerEvents = 'none';
                document.body.classList.remove('rush-ocean', 'rush-sky', 'rush-hell');
            }
        });

        document.querySelectorAll('.symbol-item').forEach(el => {
            // Enable clicks after reveal animation
            el.addEventListener('animationend', () => el.classList.add('visible'));

            el.addEventListener('click', function (e) {
                e.preventDefault();
                const { ovl, body, href } = routes[this.id];
                overlay.className = ovl;
                overlay.style.pointerEvents = 'all';
                document.body.classList.add(body);   // zoom toward destination
                setTimeout(() => { window.location.href = href; }, 880);
            });
        });
    </script>
</body>
</html>
